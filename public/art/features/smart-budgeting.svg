<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 309 180" fill="none">
  <defs>
    <filter id="smart-budgeting-shadow" x="-30%" y="-25%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1A1A1A" flood-opacity="0.08"/>
    </filter>
    <filter id="smart-budgeting-pill" x="-40%" y="-50%" width="180%" height="240%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A1A1A" flood-opacity="0.14"/>
    </filter>
  </defs>
  <!-- back card -->
  <g transform="translate(96 82) rotate(-7.6)">
    <rect x="-71" y="-71" width="142" height="142" rx="21" fill="#fff" stroke="#F0F0F0" filter="url(#smart-budgeting-shadow)"/>
    <g transform="translate(0 -15) rotate(-171)">
      <circle r="26" stroke="#FF8A5C" stroke-width="18" stroke-dasharray="71.51 163.36" stroke-dashoffset="-1"/>
      <circle r="26" stroke="#FFC9A0" stroke-width="18" stroke-dasharray="33.94 163.36" stroke-dashoffset="-74.51"/>
      <circle r="26" stroke="#4686FE" stroke-width="18" stroke-dasharray="51.91 163.36" stroke-dashoffset="-110.45"/>
    </g>
    <g>
      <circle cx="-44" cy="40" r="3.5" fill="#FF8A5C"/><rect x="-34" y="37.5" width="58" height="5" rx="2.5" fill="#E9ECF1"/>
      <circle cx="-44" cy="55" r="3.5" fill="#FFC9A0"/><rect x="-34" y="52.5" width="42" height="5" rx="2.5" fill="#E9ECF1"/>
    </g>
    <g transform="translate(0 -15)">
    <g transform="translate(0 -26)" filter="url(#smart-budgeting-pill)">
      <rect x="-14" y="-7.5" width="28" height="15" rx="7.5" fill="#fff"/>
    </g>
    <text x="0" y="-23.1" text-anchor="middle" font-family="Geist, Inter, Arial, sans-serif" font-size="8" font-weight="500" fill="#1A1A1A">45%</text>
    </g>
  </g>
  <!-- front card -->
  <g transform="translate(214 90) rotate(8)">
    <rect x="-74" y="-74" width="148" height="148" rx="22" fill="#fff" stroke="#F0F0F0" filter="url(#smart-budgeting-shadow)"/>
    <g transform="translate(0 -16) rotate(-90)">
      <circle r="26" stroke="#4686FE" stroke-width="18" stroke-dasharray="120.52 163.36" stroke-dashoffset="-1"/>
      <circle r="26" stroke="#FFC9A0" stroke-width="18" stroke-dasharray="38.84 163.36" stroke-dashoffset="-123.52"/>
    </g>
    <g transform="translate(0 4)">
      <circle cx="-44" cy="40" r="3.5" fill="#4686FE"/><rect x="-34" y="37.5" width="58" height="5" rx="2.5" fill="#E9ECF1"/>
      <circle cx="-44" cy="55" r="3.5" fill="#FFC9A0"/><rect x="-34" y="52.5" width="42" height="5" rx="2.5" fill="#E9ECF1"/>
    </g>
    <g transform="translate(0 -16)">
    <g transform="translate(18.38 18.38)" filter="url(#smart-budgeting-pill)">
      <rect x="-14" y="-7.5" width="28" height="15" rx="7.5" fill="#fff"/>
    </g>
    <text x="18.38" y="21.28" text-anchor="middle" font-family="Geist, Inter, Arial, sans-serif" font-size="8" font-weight="500" fill="#1A1A1A">75%</text>
    </g>
  </g>
</svg>
